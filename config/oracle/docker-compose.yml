volumes:
  nvg_oracle_data:
services:
  oracle-vg:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: nvg
    ports:
      - 1521:1521
    volumes:
      - "nvg_oracle_data:/opt/oracle/oradata"
      - "./initdb:/container-entrypoint-initdb.d"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      retries: 30
      start_period: 120s
      timeout: 10s
  neo4j:
    depends_on:
      oracle-vg:
        condition: service_healthy
    volumes:
      - "./jdbc/ojdbc17.jar:/var/lib/neo4j/lib/ojdbc17.jar"
      - "./nvg-config:/nvg_home"
