volumes:
  nvg_workspaces_data:
services:
  postgres-workspaces:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: workspaces
      POSTGRES_USER: workspaces
      POSTGRES_DB: workspaces
    ports:
      - 5489:5432
    volumes:
      - "nvg_workspaces_data:/var/lib/postgresql/data"
      - "./initdb:/docker-entrypoint-initdb.d"
    command: ["postgres", "-c", "wal_level=logical", "-c", "log_statement=all"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspaces"]
      interval: 5s
      retries: 10
      start_period: 10s
      timeout: 5s
  neo4j:
    depends_on:
      postgres-workspaces:
        condition: service_healthy
    volumes:
      - "../postgres/jdbc/postgresql-42.7.11.jar:/var/lib/neo4j/lib/postgresql-42.7.11.jar"
      - "./nvg-config:/nvg_home"
