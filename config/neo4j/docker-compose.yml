services:
  neo4j2:
    image: neo4j:2026.05.0-enterprise
    ports:
      - 17474:7474
      - 17473:7473
      - 17687:7687
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_AUTH=neo4j/hellopassword
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "hellopassword", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
  neo4j-config-cli:
    image: graphaware/neo4j-config-cli:2.7.3
    environment:
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_URI=bolt://neo4j2:7687
      - IMPORT_PATH=/config
    volumes:
      - "./seed:/config"
    depends_on:
      neo4j2:
        condition: service_healthy
  neo4j:
    depends_on:
      neo4j-config-cli:
        condition: service_completed_successfully
    volumes:
      - "./jdbc/neo4j-jdbc-driver-6.13.0.jar:/var/lib/neo4j/lib/neo4j-jdbc-driver-6.13.0.jar"
      - "./nvg-config:/nvg_home"
