volumes:
  pinot-data:

services:
  pinot-zookeeper:
    image: zookeeper:3.9
    hostname: pinot-zookeeper
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: "server.1=pinot-zookeeper:2888:3888;2181"
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,stat,srvr"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  pinot-controller:
    image: apachepinot/pinot:1.3.0
    command: StartController -zkAddress pinot-zookeeper:2181
    hostname: pinot-controller
    ports:
      - "9000:9000"
    depends_on:
      pinot-zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  pinot-broker:
    image: apachepinot/pinot:1.3.0
    command: StartBroker -zkAddress pinot-zookeeper:2181 -configFileName /opt/pinot/conf/broker-extra.conf
    hostname: pinot-broker
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1g -Dpinot.broker.enableMultiStagePipeline=true -Dpinot.multistage.engine.enabled=true"
    volumes:
      - ./config/pinot/broker.conf:/opt/pinot/conf/broker-extra.conf:ro
    ports:
      - "8099:8099"
    depends_on:
      pinot-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pinot-server:
    image: apachepinot/pinot:1.3.0
    command: StartServer -zkAddress pinot-zookeeper:2181
    hostname: pinot-server
    volumes:
      - pinot-data:/tmp/data
    depends_on:
      pinot-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  pinot-init:
    image: apachepinot/pinot:1.3.0
    hostname: pinot-init
    depends_on:
      pinot-server:
        condition: service_healthy
    volumes:
      - ./config/minio:/csv:ro
      - ./config/pinot/schemas:/schemas:ro
      - ./config/pinot/tables:/tables:ro
      - ./config/pinot/ingestion:/ingestion:ro
      - ./config/pinot/init/init.sh:/init.sh:ro
    entrypoint: ["/bin/bash", "/init.sh"]
    restart: "no"

  neo4j:
    depends_on:
      pinot-init:
        condition: service_completed_successfully
    volumes:
      - "./config/pinot/jdbc/pinot-jdbc-client-1.3.0.jar:/var/lib/neo4j/lib/pinot-jdbc-client-1.3.0.jar"
      - "./config/pinot/nvg-config:/nvg_home"
