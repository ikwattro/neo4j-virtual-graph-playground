services:
  neo4j:
    image: neo4j:2026.05.0-enterprise
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_AUTH=neo4j/hellopassword
      # Virtual Graphs
      - NEO4J_internal_virtual__graph_enabled=true
      - NEO4J_internal_virtual__graph_home=/nvg_home